spring.application.name=sponsor-scout

spring.ai.mcp.server.name=sponsor-scout
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.protocol=streamable
spring.ai.mcp.server.type=sync
spring.ai.mcp.server.request-timeout=60s
spring.ai.mcp.server.instructions=Sponsor Scout helps people on F-1 OPT or H-1B find US jobs at employers that actually file H-1B paperwork. \
Every tool result has a short "speech" field written to be read aloud. Say that first, then offer details. \
Sponsor numbers come from US Department of Labor LCA disclosure data (certified H-1B cases), not from the employers.

spring.datasource.url=jdbc:sqlite:${SCOUT_DB:data/scout.db}?journal_mode=WAL&busy_timeout=5000
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always
